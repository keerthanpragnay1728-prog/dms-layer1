# =============================================================================
# Base config for Layer 1 experiments.
#
# Every script takes --config and reads ONLY from here (plus the landmark
# schema file this points at). No hardcoded paths or magic numbers in code.
# Every experiment output is written together with a copy of the config that
# produced it, so any reported number can be reconstructed.
# =============================================================================

# Global RNG seed: python `random`, numpy, and (from milestone 4) torch.
# Documented in README. Change it only as a deliberate experiment.
seed: 42

# Path to the 24-point schema + WFLW index mapping. Relative paths are
# resolved against the directory containing THIS config file.
landmark_schema: landmarks_24.yaml

dataset:
  # Kaggle mount of the public WFLW dataset. On a different machine, point
  # this at your local WFLW root instead; the loader fails with a clear
  # message (listing what it found) if the layout underneath is wrong.
  root: /kaggle/input/datasets/mrriandmstique/wflw-wider-facial-landmarks-in-the-wild
  images_dir: WFLW_images
  annotations_dir: WFLW_annotations
  # The two full annotation files (98 coords + face rect + 6 attribute flags
  # + image path per line), relative to annotations_dir.
  train_list: list_98pt_rect_attr_train_test/list_98pt_rect_attr_train.txt
  test_list: list_98pt_rect_attr_train_test/list_98pt_rect_attr_test.txt
  # The 6 binary attribute columns, in file order. Also used to derive the
  # official test subsets (pose -> "largepose" etc.).
  attribute_names: [pose, expression, illumination, makeup, occlusion, blur]

# ----- milestone 1: mapping visualisation ------------------------------------
visualize:
  split: test          # which annotation list to sample from
  num_frontal: 4       # faces with no pose/occlusion flag
  num_largepose: 4     # faces with the pose flag (profile-ish)
  num_occluded: 4      # faces with the occlusion flag
  out_dir: /kaggle/working/m1_overlays
  inset_size: 320      # pixel width of the zoomed eye/mouth insets

# ----- milestone 2: crop cache (one-time preprocess; see data/cache.py) -----
preprocess:
  cache_size: 128      # cached grayscale crop resolution (uint8, HxW)
  crop_expand: 1.30    # square crop side = 1.3 x the 98-point extent
                       # (~15% context margin each side; train-time scale/
                       # translation augmentation bridges the gap to Haar
                       # boxes, which milestone 3 will quantify)
  num_preview: 16      # crops rendered per split for the eyeball check
  out_dir: /kaggle/working/cache   # where build_crop_cache WRITES

# Where training/evaluation READS the built cache. On Kaggle this is a
# read-only mount: either a published dataset path, or (as currently used)
# the committed output of the milestone-2 notebook attached via
# Add Input -> Notebooks. Locally, point at wherever the cache was built.
cache:
  dir: /kaggle/input/notebook1aae8c57db/cache

# ----- milestone 3: Haar face detection front-end ----------------------------
face_detector:
  # resolved from this repo's assets/ (vendored copy), cv2.data as fallback
  haar_cascade: haarcascade_frontalface_default.xml
  # Operating point adopted from the pose sweep (scripts/sweep_haar_pose.py,
  # decision recorded in docs/milestone3_notes.md): vs the old (1.10, 5)
  # it lifts pose detection 17.8% -> 33.7% and no-flag 79.8% -> 86.8% at
  # ~157 ms/image, costing unmatched boxes (1.80 -> 5.00 per image --
  # acceptable: deployment takes the largest box, and WFLW's extra boxes are
  # largely unannotated faces).
  scale_factor: 1.05   # detectMultiScale pyramid step
  min_neighbors: 2
  min_size_frac: 0.08  # min face side as a fraction of min(image h, w)
  equalize_hist: true  # histogram-equalise before detection
  # Calibration from a raw Haar box to the model's crop box (the same kind
  # of box the cache was built with): side = max(w, h) * box_scale, centre
  # shifted down by box_shift_y * side. Adopted from the containment grid
  # search on real WFLW: 99.73% landmark containment, vs 98.47% for
  # (1.45, 0.13) and 82.81% for the median fit (docs/milestone3_notes.md).
  # Cost flag: the bigger box means less face per pixel at deploy time --
  # quantified in the docs; milestone 6 measures the NME gap GT-box vs
  # Haar-box before any counter-measure is taken.
  box_scale: 1.75
  box_shift_y: 0.08
  match_iou: 0.30      # Haar box <-> annotated face matching threshold
  # Profile-face fallback for turned heads: when the frontal cascade finds
  # nothing, run the profile cascade on the image and its mirror. OFF until
  # scripts/sweep_haar_pose.py shows what it buys and what it costs.
  profile_fallback: false
  profile_cascade: haarcascade_profileface.xml

# ----- milestone 4: training (settings agreed up front; the code that reads
# ----- them lands in that milestone) -----------------------------------------
model:
  input_size: 112      # network input resolution (square, grayscale)
  num_points: 24
  width: 32            # channel width; 32 -> ~0.59M params, ~2.4 MB fp32
train:
  batch_size: 128
  num_workers: 2
  val_fraction: 0.1    # seeded random split of the train cache (WFLW has no
                       # subject IDs, so a random face split is the only option)
  pixel_mean: 0.5      # input normalisation: (x/255 - mean) / std
  pixel_std: 0.5
  optimizer: adamw     # adamw | adam
  lr: 0.001
  weight_decay: 0.0001
  schedule: cosine
  epochs: 120
  early_stopping_patience: 20
  loss: l2             # l2 | wing  (selectable for the loss comparison)
  wing: {w: 10.0, epsilon: 2.0}   # in pixels of the model input
  augment:
    rotation_deg: 15
    scale: [0.85, 1.15]
    translate_frac: 0.05   # of the model input size
    brightness: 30         # +- gray levels
    contrast: 0.2          # alpha in [0.8, 1.2]
    blur_prob: 0.15
    flip_prob: 0.5         # horizontal flip WITH landmark index remap
  resume: false        # true -> restore optimiser/scheduler/epoch/RNG state
  stop_after_epochs: null   # stop cleanly after N epochs this session
                            # (Kaggle 12h cap); resume continues identically
  checkpoint_dir: /kaggle/working/checkpoints
  metrics_csv: /kaggle/working/metrics.csv
  curves_png: /kaggle/working/curves.png
